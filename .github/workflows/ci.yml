name: CI

on:
  push:
    paths: ["web/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/ci.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  deploy:
    # Deploys to Cloudflare when pushing to main or the working branch, if the CLOUDFLARE_API_TOKEN secret is set.
    needs: check
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/hi-l4avs8') && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The secret may be stored under either name (CFTOKEN is easier to type on a phone).
      - name: Check for deploy token
        id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' || secrets.CFTOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy (schema is applied by the Worker on first request)
        if: steps.token.outputs.present == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN || secrets.CFTOKEN }}
